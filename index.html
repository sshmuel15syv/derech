<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16212A">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>מפת הדרך שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Assistant:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: journey column (projects → winding trail of stages) beside a standing chat panel; on phones the two are tabs. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#16212A; --muted:#5A6772; --line:#D6DDE3;
  --road:#2B3944; --stripe:#FFFFFF; --accent:#DD6A1F; --accent-soft:#FBE7D9; --blue:#2C69AE; --blue-soft:#E1ECF8;
  --ok:#2C8655; --ok-soft:#DDF1E5; --warn:#B7791F; --danger:#C0392B; --shadow:0 1px 2px rgba(20,35,45,.06),0 6px 18px rgba(20,35,45,.06);
  --f-display:"Rubik","Assistant",system-ui,sans-serif; --f-body:"Assistant","Rubik",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1419; --surface:#172028; --surface-2:#1C2731; --ink:#E6EBEF; --muted:#93A1AC; --line:#2A3743;
  --road:#384955; --stripe:#C9D3DA; --accent:#F08A43; --accent-soft:#3A2617; --blue:#5E9DE2; --blue-soft:#182C42;
  --ok:#4DBA7E; --ok-soft:#163223; --warn:#E0A84A; --danger:#E06A5C; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1419; --surface:#172028; --surface-2:#1C2731; --ink:#E6EBEF; --muted:#93A1AC; --line:#2A3743;
  --road:#384955; --stripe:#C9D3DA; --accent:#F08A43; --accent-soft:#3A2617; --blue:#5E9DE2; --blue-soft:#182C42;
  --ok:#4DBA7E; --ok-soft:#163223; --warn:#E0A84A; --danger:#E06A5C; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.blaze{display:grid;grid-template-rows:1fr 1fr 1fr;width:14px;height:22px;border-radius:2px;overflow:hidden;border:1px solid var(--line);flex:none}
.blaze i:nth-child(1){background:#fff}.blaze i:nth-child(2){background:var(--blue)}.blaze i:nth-child(3){background:var(--accent)}
.brand h1{font-size:1.15rem}
.brand small{color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{margin-inline-start:auto;font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--ok)}.sync.busy i{background:var(--warn)}.sync.err i{background:var(--danger)}

.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:calc(100% - 57px)}
.main{overflow-y:auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.main-in{max-width:820px;margin-inline:auto;display:flex;flex-direction:column;gap:28px}
.chat{border-inline-start:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);height:calc(100% - 57px - 62px - env(safe-area-inset-bottom,0px))}
  .app[data-tab="main"] .chat{display:none}
  .app[data-tab="chat"] .main{display:none}
  .chat{border:0}
  .tabs{display:flex;position:fixed;inset:auto 0 0;z-index:9;background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabs button{flex:1;border:0;background:none;padding:10px 0 12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.85rem}
  .tabs button[aria-selected="true"]{color:var(--accent)}
  .tabs svg{width:22px;height:22px}
}

.sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec-head h2{font-size:1.25rem}
.sec-head .sub{color:var(--muted);font-size:.9rem}
.sec-head .act{margin-inline-start:auto;display:flex;gap:8px}
.btn{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--ink);border-color:var(--muted)}
.icon-btn svg{width:16px;height:16px}

/* Today */
.day-nav{display:flex;align-items:center;gap:6px}
.agenda{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ev{display:grid;grid-template-columns:auto 64px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev time{font-family:var(--f-mono);font-size:.85rem;color:var(--blue);font-variant-numeric:tabular-nums}
.ev .t{min-width:0}
.ev .t b{font-weight:600;display:block;overflow-wrap:anywhere}
.ev .t span{font-size:.8rem;color:var(--muted)}
.ev.done .t b{text-decoration:line-through;color:var(--muted)}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;flex:none}
.chk[aria-checked="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.chk svg{width:14px;height:14px}
.empty{padding:22px 16px;color:var(--muted);text-align:center;font-size:.95rem}
.empty b{color:var(--ink);display:block;margin-bottom:4px;font-family:var(--f-display);font-weight:500}

/* Projects */
.plist{display:grid;gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;cursor:pointer;box-shadow:var(--shadow)}
.pcard:hover{border-color:var(--muted)}
.rank{font-family:var(--f-mono);font-size:1.1rem;color:var(--muted);width:28px;text-align:center;font-variant-numeric:tabular-nums}
.pcard h3{font-size:1.05rem;overflow-wrap:anywhere}
.pmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:.85rem;color:var(--muted)}
.pill{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em}
.pill.high{background:var(--accent-soft);color:var(--accent)}
.pill.medium{background:var(--blue-soft);color:var(--blue)}
.pill.low{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.paused{background:var(--surface-2);color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.order{display:flex;flex-direction:column;gap:4px}

/* Project / trail */
.phead{display:flex;flex-direction:column;gap:10px}
.crumbs{display:flex;align-items:center;gap:8px}
.phead h2{font-size:1.6rem}
.phead p{margin:0;color:var(--muted);max-width:65ch}
.phead .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.trail{position:relative;padding-block:8px 8px;display:flex;flex-direction:column;gap:18px}
.trail::before{content:"";position:absolute;top:22px;bottom:30px;right:23px;width:14px;border-radius:7px;background:var(--road)}
.trail::after{content:"";position:absolute;top:30px;bottom:38px;right:29px;width:2px;background:repeating-linear-gradient(to bottom,var(--stripe) 0 10px,transparent 10px 20px);opacity:.75}
.stop{position:relative;display:grid;grid-template-columns:60px minmax(0,1fr);align-items:start}
.pin{position:relative;z-index:1;width:36px;height:36px;margin:6px 12px 0 0;border-radius:50%;background:var(--surface);border:3px solid var(--road);display:grid;place-items:center;font-family:var(--f-mono);font-size:.85rem;font-weight:500;color:var(--ink)}
.stop.done .pin{background:var(--ok);border-color:var(--ok);color:#fff}
.stop.here .pin{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 6px var(--accent-soft)}
.pin svg{width:16px;height:16px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.stop.here .scard{border-color:var(--accent)}
.shead{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;width:100%;background:none;border:0;text-align:right}
.shead .ttl{flex:1;min-width:0}
.shead .ttl b{font-family:var(--f-display);font-weight:500;font-size:1.05rem;display:block;overflow-wrap:anywhere}
.shead .ttl span{font-size:.82rem;color:var(--muted)}
.here-tag{font-size:.72rem;font-weight:700;color:var(--accent);letter-spacing:.04em}
.chev{transition:transform .2s;color:var(--muted);width:18px;height:18px;flex:none}
.scard.open .chev{transform:rotate(180deg)}
.tasks{border-top:1px solid var(--line);padding:6px 6px 10px}
.task{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px}
.task:hover{background:var(--surface-2)}
.task .tt{flex:1;min-width:0;background:none;border:0;text-align:right;padding:0;cursor:pointer}
.task .tt b{font-weight:600;overflow-wrap:anywhere}
.task .tt small{display:block;color:var(--muted);font-size:.8rem}
.task.done .tt b{text-decoration:line-through;color:var(--muted)}
.has-notes{font-size:.72rem;color:var(--blue);font-weight:700;white-space:nowrap}
.add-row{display:flex;gap:8px;padding:6px 8px 0}
.add-row input{flex:1;min-width:0;border:1px dashed var(--line);background:var(--surface-2);border-radius:10px;padding:7px 10px}
.finish{display:grid;grid-template-columns:60px minmax(0,1fr);align-items:center}
.flag{position:relative;z-index:1;margin-right:12px;width:36px;height:36px;display:grid;place-items:center;border-radius:8px;background:var(--road);color:var(--stripe)}
.flag svg{width:18px;height:18px}
.finish .lbl{font-family:var(--f-display);font-weight:500;color:var(--muted)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,18,24,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(640px,100%);max-height:88%;overflow:auto;border-radius:18px 18px 0 0;
  padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
@media (min-width:901px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet h3{font-size:1.25rem}
.sheet .kicker{font-size:.8rem;color:var(--muted);letter-spacing:.03em}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.85rem;font-weight:600;color:var(--muted)}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 12px;width:100%}
.field textarea{min-height:160px;resize:vertical;line-height:1.55}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap}
.sheet .acts .sp{flex:1}
.notes{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;line-height:1.65}
.notes ol,.notes ul{margin:4px 0;padding-inline-start:22px}
.notes li{margin:4px 0}
.notes p{margin:6px 0}
.notes h4{margin:10px 0 4px;font-family:var(--f-display);font-weight:500;font-size:1rem}

/* Chat */
.chat-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.chat-head h2{font-size:1.05rem}
.chat-head .sub{font-size:.8rem;color:var(--muted)}
.chat-head .act{margin-inline-start:auto}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.msg{max-width:88%;padding:9px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.msg.user{align-self:flex-start;background:var(--blue);color:#fff;border-end-start-radius:4px}
.msg.assistant{align-self:flex-end;background:var(--surface-2);border:1px solid var(--line);border-end-end-radius:4px}
.msg.note{align-self:center;font-size:.8rem;color:var(--muted);background:none;padding:2px 8px}
.msg .ops{display:block;margin-top:6px;font-size:.78rem;color:var(--ok);white-space:normal}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.85rem;color:var(--muted)}
.chip:hover{color:var(--ink);border-color:var(--muted)}
.composer{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line);align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:9px 12px;max-height:140px;min-height:42px}
.send{width:42px;height:42px;border-radius:12px;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.send:disabled{opacity:.5;cursor:default}
.send svg{width:18px;height:18px;transform:scaleX(-1)}
.bridge{margin:0 12px 10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.bridge label{font-weight:600;color:var(--muted);font-size:.85rem}
.bridge textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;resize:vertical;min-height:70px}
.bridge-step{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.bridge-acts{display:flex;gap:8px}
.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;z-index:30;font-size:.9rem;max-width:calc(100% - 32px)}
.banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:10px 14px;font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="blaze" aria-hidden="true"><i></i><i></i><i></i></span>
    <div style="min-width:0;display:flex;flex-direction:column">
      <h1>מפת הדרך שלי</h1>
      <small id="today-label"></small>
    </div>
  </div>
  <div class="sync" id="sync"><i></i><span>טוען…</span></div>
  <button class="icon-btn" id="settings" type="button" aria-label="הגדרות"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
</header>

<div class="app" id="app" data-tab="main">
  <main class="main" id="main"><div class="main-in" id="main-in"></div></main>
  <aside class="chat" id="chat" aria-label="שיחה עם Claude">
    <div class="chat-head">
      <div><h2>שיחה עם Claude</h2><div class="sub" id="chat-sub">אפשר לבקש לשנות משימות, שלבים וסדר יום</div></div>
      <div class="act"><button class="btn ghost" id="clear-chat" type="button">ניקוי</button></div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="chips" id="chips"></div>
    <div class="bridge" id="bridge" hidden>
      <div class="bridge-step" id="bridge-copied" hidden>
        <b>הועתק.</b> הדבק ב-Claude ושלח: בשיחה חדשה, או בתוך שיחה שבה עבדת על פרויקט, כדי שיעדכן לפי מה שעשיתם בה. כשהוא עונה, העתק את כל התשובה וחזור לכאן.
        <a class="btn" href="https://claude.ai/new" target="_blank" rel="noopener">פתח את Claude</a>
      </div>
      <label for="bridge-paste">התשובה של Claude</label>
      <textarea id="bridge-paste" rows="3" placeholder="הדבק כאן את כל התשובה של Claude"></textarea>
      <div class="bridge-acts"><button class="btn primary" id="bridge-apply" type="button">ביצוע השינויים</button><button class="btn ghost" id="bridge-close" type="button">סגירה</button></div>
    </div>
    <form class="composer" id="composer">
      <textarea id="chat-input" rows="1" placeholder="מה לשנות? למשל: תזיז את שיחות הגילוי למחר ב-10"></textarea>
      <button class="send" id="send" type="submit" aria-label="שליחה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
  </aside>
</div>

<nav class="tabs" role="tablist">
  <button type="button" role="tab" id="tab-main" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21c0-5 12-4 12-9S9 8 9 4"/><circle cx="9" cy="3.5" r="1.5"/><circle cx="6" cy="21" r="1.5"/></svg>המסע</button>
  <button type="button" role="tab" id="tab-chat" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>שיחה</button>
</nav>

<script>
(function(){
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = (p) => p + "-" + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, "0");
const dkey = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
const PRI = {high:"דחוף", medium:"בינוני", low:"נמוך"};
const ICON = {
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',

  flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-2 4 2 4H5"/></svg>',

let S = {projects: [], events: []};
let chat = [];
let loaded = false, busy = false;
let viewDate = new Date();
let openStages = new Set();
let tab = "main";

// ---------- settings & storage ----------
const LS = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};
const cfg = () => ({apiKey: LS.get("derech-api-key") || "", sheetUrl: LS.get("derech-sheet-url") || "", secret: LS.get("derech-secret") || ""});
let pending = false, pushing = false, pushTimer = null, remoteStamp = LS.get("derech-remote-stamp") || "";

function setSync(cls, text){ const el = $("#sync"); el.className = "sync " + cls; el.lastElementChild.textContent = text; }
function normalize(d){
  const s = {projects: Array.isArray(d?.projects) ? d.projects : [], events: Array.isArray(d?.events) ? d.events : []};
  s.projects.forEach(p => { p.stages = Array.isArray(p.stages) ? p.stages : []; p.stages.forEach(st => st.tasks = Array.isArray(st.tasks) ? st.tasks : []); });
  return s;
}
function saveLocal(){ LS.set("derech-data", JSON.stringify({state: S, chat: chat.slice(-60), pending})); }
function loadLocal(){ try { const r = JSON.parse(LS.get("derech-data") || "null"); if(r){ S = normalize(r.state); chat = Array.isArray(r.chat) ? r.chat : []; pending = !!r.pending; loaded = true; } } catch(e){} }

function persist(){ render(); markChanged(); }
function saveChat(){ markChanged(); }
function markChanged(){
  pending = true; saveLocal();
  if(!cfg().sheetUrl){ setSync("ok", "נשמר במכשיר"); return; }
  setSync("busy", "שומר…");
  clearTimeout(pushTimer); pushTimer = setTimeout(push, 800);
}
async function push(){
  const c = cfg(); if(!c.sheetUrl || pushing) return;
  pushing = true;
  try {
    while(pending){
      pending = false; saveLocal();
      const r = await fetch(c.sheetUrl, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify({key: c.secret, state: S, chat: chat.slice(-60)})});
      const j = await r.json();
      if(!j.ok) throw new Error(j.error || "save failed");
      remoteStamp = j.updatedAt; LS.set("derech-remote-stamp", remoteStamp);
    }
    setSync("ok", "מסונכרן");
  } catch(e){ pending = true; saveLocal(); setSync("err", "לא נשמר בגיליון, ננסה שוב"); clearTimeout(pushTimer); pushTimer = setTimeout(push, 15000); }
  pushing = false;
}
async function pull(){
  const c = cfg(); if(!c.sheetUrl) return;
  if(pending){ return push(); }
  try {
    const r = await fetch(c.sheetUrl + (c.sheetUrl.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(c.secret));
    const j = await r.json();
    if(!j.ok){ setSync("err", j.error === "bad key" ? "הקוד הסודי לא תואם" : "שגיאה בגיליון"); return; }
    if(pending || busy) return;
    if(j.updatedAt && j.updatedAt !== remoteStamp){
      if(j.state) S = normalize(j.state);
      if(Array.isArray(j.chat)) chat = j.chat;
      remoteStamp = j.updatedAt; LS.set("derech-remote-stamp", remoteStamp);
      saveLocal(); render(); renderChat();
    } else if(!j.updatedAt && (S.projects.length || chat.length)){ pending = true; push(); return; }
    loaded = true; setSync("ok", "מסונכרן");
  } catch(e){ setSync("err", "אין חיבור לגיליון"); }
}

function boot(){
  $("#today-label").textContent = new Date().toLocaleDateString("he-IL", {weekday:"long", day:"numeric", month:"long"});
  loadLocal(); loaded = true;
  render(); renderChat();
  if(!cfg().sheetUrl){ setSync("", "לא מחובר לגיליון"); if(!cfg().apiKey) openSettings(true); return; }
  setSync("busy", "מתעדכן…");
  pull();
  setInterval(() => { if(document.visibilityState === "visible") pull(); }, 60000);
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") pull(); });
}

function openSettings(first){
  const c = cfg();
  sheet({kicker: "הגדרות", title: first ? "ברוך הבא! שני חיבורים קטנים" : "חיבורים",

    fields: [
      {key: "sheetUrl", label: "כתובת ה-Web App של הגיליון (מסתיימת ב-/exec)", value: c.sheetUrl, ph: "https://script.google.com/macros/s/…/exec"},
      {key: "secret", label: "הקוד הסודי (אותו SECRET שכתבת בסקריפט)", value: c.secret},

    ],

// ---------- helpers ----------
const findP = id => { const p = S.projects.find(x => x.id === id); if(!p) throw new Error("project not found: " + id); return p; };
const findS = (p, id) => { const s = p.stages.find(x => x.id === id); if(!s) throw new Error("stage not found: " + id); return s; };
const findT = (s, id) => { const t = s.tasks.find(x => x.id === id); if(!t) throw new Error("task not found: " + id); return t; };
const findE = id => { const e = S.events.find(x => x.id === id); if(!e) throw new Error("event not found: " + id); return e; };
function stats(p){
  let all = 0, done = 0;
  p.stages.forEach(s => { if(s.tasks.length){ s.tasks.forEach(t => { all++; if(t.done) done++; }); } else { all++; if(s.done) done++; } });
  return {all, done, pct: all ? Math.round(done/all*100) : 0};
}
const stageDone = s => s.done || (s.tasks.length > 0 && s.tasks.every(t => t.done));
const currentStage = p => p.stages.find(s => !stageDone(s));
function move(arr, i, to){ to = Math.max(0, Math.min(arr.length-1, to)); const [x] = arr.splice(i, 1); arr.splice(to, 0, x); }
function toast(t){ const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.append(el); setTimeout(() => el.remove(), 2400); }

function notesHTML(txt){
  const lines = String(txt || "").split(/\r?\n/);
  let out = "", list = null;
  const close = () => { if(list){ out += "</" + list + ">"; list = null; } };
  for(const raw of lines){
    const l = raw.trim();
    let m;
    if(!l){ close(); continue; }
    if((m = l.match(/^#{1,4}\s+(.*)/))){ close(); out += "<h4>" + esc(m[1]) + "</h4>"; }
    else if((m = l.match(/^(\d+)[.)]\s+(.*)/))){ if(list !== "ol"){ close(); out += "<ol>"; list = "ol"; } out += "<li>" + esc(m[2]) + "</li>"; }
    else if((m = l.match(/^[-*•]\s+(.*)/))){ if(list !== "ul"){ close(); out += "<ul>"; list = "ul"; } out += "<li>" + esc(m[1]) + "</li>"; }
    else { close(); out += "<p>" + esc(l) + "</p>"; }
  }
  close();
  return out;
}

// ---------- sheet ----------
function sheet({kicker, title, body = "", fields = [], onSave, onDelete, saveLabel = "שמירה"}){
  const scrim = document.createElement("div"); scrim.className = "scrim";
  let f = "";
  fields.forEach(x => {
    const id = "f-" + x.key;
    let ctl;
    if(x.type === "textarea") ctl = '<textarea id="' + id + '" placeholder="' + esc(x.ph || "") + '">' + esc(x.value || "") + '</textarea>';
    else if(x.type === "select") ctl = '<select id="' + id + '">' + x.options.map(o => '<option value="' + esc(o[0]) + '"' + (o[0] === (x.value || "") ? " selected" : "") + '>' + esc(o[1]) + '</option>').join("") + '</select>';
    else ctl = '<input id="' + id + '" type="' + (x.type || "text") + '" value="' + esc(x.value || "") + '" placeholder="' + esc(x.ph || "") + '">';
    f += '<div class="field"><label for="' + id + '">' + esc(x.label) + '</label>' + ctl + '</div>';
  });
  scrim.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + (kicker ? '<div class="kicker">' + esc(kicker) + '</div>' : "") + '<h3>' + esc(title) + '</h3>' + body + f +
    '<div class="acts">' + (onSave ? '<button class="btn primary" data-k="save">' + esc(saveLabel) + '</button>' : "") + '<button class="btn" data-k="close">סגירה</button><span class="sp"></span>' +
    (onDelete ? '<button class="btn danger" data-k="del">מחיקה</button>' : "") + '</div></div>';
  document.body.append(scrim);
  const close = () => scrim.remove();
  const vals = () => Object.fromEntries(fields.map(x => [x.key, $("#f-" + x.key, scrim).value.trim()]));
  scrim.addEventListener("click", e => {
    if(e.target === scrim) return close();
    const k = e.target.closest("[data-k]")?.dataset.k;
    if(k === "close") close();
    if(k === "save"){ const v = vals(); if(fields[0] && fields[0].required && !v[fields[0].key]) return $("#f-" + fields[0].key, scrim).focus(); onSave(v); close(); }
    if(k === "del"){ const b = e.target.closest("[data-k]"); if(b.dataset.armed){ onDelete(); close(); } else { b.dataset.armed = 1; b.textContent = "ללחוץ שוב למחיקה"; } }
    if(k === "edit-notes"){ e.target.closest("[data-k]").remove(); const n = $(".notes", scrim); if(n) n.remove(); $("#f-details", scrim).closest(".field").hidden = false; }
  });
  scrim.addEventListener("keydown", e => { if(e.key === "Escape") close(); });
  const first = $("input,textarea,select", scrim); if(first && !first.closest("[hidden]")) setTimeout(() => first.focus(), 30);
}
const priOpts = [["high","דחוף"],["medium","בינוני"],["low","נמוך"]];
const projOpts = () => [["", "ללא פרויקט"]].concat(S.projects.map(p => [p.id, p.name]));

function editStage(p, s){

function openTask(p, s, t){
  const body = t.details ? '<div class="notes">' + notesHTML(t.details) + '</div><div><button class="btn" data-k="edit-notes">' + ICON.edit + 'עריכת הפירוט</button></div>' : "";
  sheet({kicker: p.name + " · " + s.title, title: t.title, body,
    fields: [{key:"title", label:"משימה", value:t.title, required:true}, {key:"estimate", label:"כמה זמן / כמה פעמים", value:t.estimate, ph:"למשל: 20 דק׳ לשיחה"},
      {key:"details", label:"פירוט: שאלות, צעדים, הערות (שורה שמתחילה ב- או 1. הופכת לרשימה)", type:"textarea", value:t.details, ph:"1. שאלה ראשונה\n2. שאלה שנייה"}],
    onSave: v => { Object.assign(t, v); persist(); },
    onDelete: () => { s.tasks = s.tasks.filter(x => x !== t); persist(); }});
  if(t.details){ const fd = document.querySelector(".scrim #f-details"); if(fd) fd.closest(".field").hidden = true; }
}
function editEvent(e){
  sheet({kicker: e ? "עריכת אירוע" : "אירוע חדש", title: e ? e.title : "מה בלו״ז?",
    fields: [{key:"title", label:"מה", value:e?.title, required:true}, {key:"date", label:"תאריך", type:"date", value:e?.date || dkey(viewDate)},
      {key:"time", label:"שעה", type:"time", value:e?.time}, {key:"projectId", label:"פרויקט", type:"select", options:projOpts(), value:e?.projectId || ""}],
    onSave: v => { if(e) Object.assign(e, v); else S.events.push({id: uid("e"), done: false, ...v}); persist(); },
    onDelete: e ? () => { S.events = S.events.filter(x => x !== e); persist(); } : null});
}

// ---------- main events ----------
$("#main").addEventListener("click", ev => {
  const b = ev.target.closest("[data-a]"); if(!b) return;
  const a = b.dataset.a, id = b.dataset.id;
  try {
    if(a === "open") return go(id);
    if(a === "home") return go("");
    if(a === "day"){ const d = +b.dataset.d; viewDate = d === 0 ? new Date() : new Date(viewDate.getFullYear(), viewDate.getMonth(), viewDate.getDate() + d); return render(); }
    if(a === "add-event") return editEvent(null);
    if(a === "edit-event") return editEvent(findE(id));
    if(a === "toggle-event"){ const e = findE(id); e.done = !e.done; return persist(); }
    if(a === "add-project") return editProject(null);
    if(a === "p-up" || a === "p-down"){ ev.stopPropagation(); const i = S.projects.findIndex(x => x.id === id); move(S.projects, i, i + (a === "p-up" ? -1 : 1)); return persist(); }
    if(a === "edit-project") return editProject(findP(id));
    if(a === "add-stage") return editStage(findP(id), null);
    const pid = b.dataset.p || route();
    if(a === "stage"){ const p = findP(route()); const cur = currentStage(p); const isHere = cur && cur.id === id;
      const isOpen = openStages.has(id) || (isHere && !openStages.has("x-" + id));
      if(isOpen){ openStages.delete(id); if(isHere) openStages.add("x-" + id); } else { openStages.add(id); openStages.delete("x-" + id); }
      return render(); }
    if(a === "edit-stage"){ const p = findP(pid); return editStage(p, findS(p, id)); }
    if(a === "s-up" || a === "s-down"){ const p = findP(pid); const i = p.stages.findIndex(x => x.id === id); move(p.stages, i, i + (a === "s-up" ? -1 : 1)); return persist(); }
    if(a === "toggle-task"){ const p = findP(pid), s = findS(p, b.dataset.s), t = findT(s, id); t.done = !t.done; openStages.add(s.id); return persist(); }
    if(a === "task"){ const p = findP(pid), s = findS(p, b.dataset.s); return openTask(p, s, findT(s, id)); }
  } catch(e){ toast("לא נמצא — אולי נמחק"); render(); }
});
$("#main").addEventListener("submit", ev => {
  const f = ev.target.closest("[data-f]"); if(!f) return; ev.preventDefault();
  const v = f.t.value.trim(); if(!v) return;
  try { const p = findP(f.dataset.p), s = findS(p, f.dataset.s); s.tasks.push({id: uid("t"), title: v, done: false}); openStages.add(s.id); persist();
    setTimeout(() => { const i = document.getElementById("add-" + s.id); if(i) i.focus(); }, 0); } catch(e){}
});

const CHIPS = ["עדכן את הפרויקטים לפי מה שעשינו בשיחה הזאת", "תסדר לי את הלו״ז של מחר לפי סדר העדיפויות", "מה הכי חשוב לעשות היום?", "פרק לי את השלב הנוכחי למשימות קצרות"];
function scrollMsgs(){ const m = $("#msgs"); m.scrollTop = m.scrollHeight; }
function renderChat(){
  $("#send").setAttribute("aria-label", cfg().apiKey ? "שליחה" : "העתקה ל-Claude");
  $("#chat-sub").textContent = cfg().apiKey ? "אפשר לבקש לשנות משימות, שלבים וסדר יום" : "כותבים בקשה, מעתיקים ל-Claude, ומדביקים את התשובה";
  const m = $("#msgs");
  let html = "";
  if(!chat.length) html = '<div class="msg assistant">שלום! אני כאן כדי לעזור לך לנהל את הפרויקטים ואת סדר היום. אפשר לבקש ממני להוסיף פרויקט, לבנות מפת דרך עם שלבים, לפרק שלב למשימות קטנות, לכתוב שאלות לשיחות, או להזיז דברים בלו״ז.</div>';
  chat.forEach(x => { html += '<div class="msg ' + (x.role === "user" ? "user" : "assistant") + '">' + esc(x.content) + (x.ops && x.ops.length ? '<span class="ops">' + x.ops.map(esc).join(" · ") + '</span>' : "") + '</div>'; });
  m.innerHTML = html;
  $("#chips").innerHTML = (chat.length > 1 && cfg().apiKey) ? "" : CHIPS.map(c => '<button type="button" class="chip">' + esc(c) + '</button>').join("");
  $("#send").disabled = busy;
  scrollMsgs();
}

  delete b.dataset.armed; b.textContent = "ניקוי"; chat = []; renderChat(); saveChat(); };

function snapshotForClaude(){
  return JSON.stringify({
    projects: S.projects.map((p, i) => ({id: p.id, rank: i+1, name: p.name, description: p.description, goal: p.goal, priority: p.priority || "medium", status: p.status || "active",
      stages: p.stages.map(s => ({id: s.id, title: s.title, due: s.due, done: stageDone(s),
        tasks: s.tasks.map(t => ({id: t.id, title: t.title, done: !!t.done, estimate: t.estimate, details: t.details ? String(t.details).slice(0, 500) : undefined}))}))})),
    events: S.events.filter(e => e.date >= dkey(new Date(Date.now() - 7*864e5))).sort((a,b) => (a.date + (a.time||"")).localeCompare(b.date + (b.time||"")))
      .map(e => ({id: e.id, date: e.date, time: e.time, title: e.title, projectId: e.projectId || undefined, done: !!e.done}))
  });
}

const str = v => v == null ? undefined : String(v);
function tools(log){
  const T = (name, description, properties, required, fn) => ({name, description, inputSchema: {type: "object", properties, required}, execute: input => { const r = fn(input || {}); persist(); return r; }});
  const s_ = {type: "string"};
  return [
    T("add_project", "Create a project. Returns its id.", {name: s_, description: s_, goal: s_, priority: {type: "string", enum: ["high","medium","low"]}, rank: {type: "number", description: "1 = top priority; omit to add last"}}, ["name"], i => {
      const p = {id: uid("p"), name: str(i.name), description: str(i.description) || "", goal: str(i.goal) || "", priority: i.priority || "medium", status: "active", stages: []};
      S.projects.push(p); if(i.rank) move(S.projects, S.projects.length-1, Number(i.rank)-1); log("נוסף פרויקט: " + p.name); return {id: p.id}; }),
    T("update_project", "Change a project's fields or its rank in the priority order (1 = first).", {projectId: s_, name: s_, description: s_, goal: s_, priority: {type: "string", enum: ["high","medium","low"]}, status: {type: "string", enum: ["active","paused"]}, rank: {type: "number"}}, ["projectId"], i => {
      const p = findP(str(i.projectId)); ["name","description","goal","priority","status"].forEach(k => { if(i[k] != null) p[k] = str(i[k]); });
      if(i.rank) move(S.projects, S.projects.indexOf(p), Number(i.rank)-1); log("עודכן פרויקט: " + p.name); return "ok"; }),
    T("add_stage", "Add a milestone stage (waypoint on the project roadmap), optionally with short tasks at once. Returns ids.", {projectId: s_, title: s_, due: {type: "string", description: "YYYY-MM-DD"}, position: {type: "number", description: "1-based; omit for last"},
      tasks: {type: "array", items: {type: "object", properties: {title: s_, estimate: s_, details: s_}, required: ["title"]}}}, ["projectId","title"], i => {
      const p = findP(str(i.projectId)); const s = {id: uid("s"), title: str(i.title), due: str(i.due) || "", tasks: []};
      (Array.isArray(i.tasks) ? i.tasks : []).forEach(t => s.tasks.push({id: uid("t"), title: str(t.title), estimate: str(t.estimate) || "", details: str(t.details) || "", done: false}));
      p.stages.push(s); if(i.position) move(p.stages, p.stages.length-1, Number(i.position)-1); log("נוסף שלב: " + s.title); return {stageId: s.id, taskIds: s.tasks.map(t => t.id)}; }),
    T("update_stage", "Rename, re-date, mark done, or move a stage.", {projectId: s_, stageId: s_, title: s_, due: s_, done: {type: "boolean"}, position: {type: "number"}}, ["projectId","stageId"], i => {
      const p = findP(str(i.projectId)), s = findS(p, str(i.stageId)); if(i.title != null) s.title = str(i.title); if(i.due != null) s.due = str(i.due);
      if(i.done != null){ s.done = !!i.done; if(s.done) s.tasks.forEach(t => t.done = true); } if(i.position) move(p.stages, p.stages.indexOf(s), Number(i.position)-1); log("עודכן שלב: " + s.title); return "ok"; }),
    T("add_task", "Add a short task to a stage. 'details' holds the how-to: questions to ask, steps, notes; use lines starting with '1.' or '-' for lists.", {projectId: s_, stageId: s_, title: s_, estimate: s_, details: s_}, ["projectId","stageId","title"], i => {
      const p = findP(str(i.projectId)), s = findS(p, str(i.stageId)); const t = {id: uid("t"), title: str(i.title), estimate: str(i.estimate) || "", details: str(i.details) || "", done: false};
      s.tasks.push(t); log("נוספה משימה: " + t.title); return {taskId: t.id}; }),
    T("update_task", "Change a task: title, estimate, details (replaces the whole text), done, or move it to another stage.", {projectId: s_, stageId: s_, taskId: s_, title: s_, estimate: s_, details: s_, done: {type: "boolean"}, moveToStageId: s_}, ["projectId","stageId","taskId"], i => {
      const p = findP(str(i.projectId)), s = findS(p, str(i.stageId)), t = findT(s, str(i.taskId));
      ["title","estimate","details"].forEach(k => { if(i[k] != null) t[k] = str(i[k]); }); if(i.done != null) t.done = !!i.done;
      if(i.moveToStageId){ const to = findS(p, str(i.moveToStageId)); s.tasks = s.tasks.filter(x => x !== t); to.tasks.push(t); }
      log((i.done ? "בוצע: " : "עודכנה משימה: ") + t.title); return "ok"; }),
    T("add_event", "Put something in the daily schedule.", {date: {type: "string", description: "YYYY-MM-DD"}, time: {type: "string", description: "HH:MM 24h, optional"}, title: s_, projectId: s_}, ["date","title"], i => {
      const e = {id: uid("e"), date: str(i.date), time: str(i.time) || "", title: str(i.title), projectId: str(i.projectId) || "", done: false};
      S.events.push(e); log("נוסף ללו״ז: " + e.title + " " + e.date.slice(5).split("-").reverse().join("/") + (e.time ? " " + e.time : "")); return {eventId: e.id}; }),
    T("update_event", "Move, rename or tick off a schedule item.", {eventId: s_, date: s_, time: s_, title: s_, projectId: s_, done: {type: "boolean"}}, ["eventId"], i => {
      const e = findE(str(i.eventId)); ["date","time","title","projectId"].forEach(k => { if(i[k] != null) e[k] = str(i[k]); }); if(i.done != null) e.done = !!i.done;
      log("עודכן בלו״ז: " + e.title); return "ok"; }),
    T("delete_item", "Delete a project, stage, task or schedule event. Only when the user clearly asked to delete it.", {kind: {type: "string", enum: ["project","stage","task","event"]}, projectId: s_, stageId: s_, taskId: s_, eventId: s_}, ["kind"], i => {
      if(i.kind === "event"){ const e = findE(str(i.eventId)); S.events = S.events.filter(x => x !== e); log("נמחק מהלו״ז: " + e.title); return "ok"; }
      const p = findP(str(i.projectId));
      if(i.kind === "project"){ S.projects = S.projects.filter(x => x !== p); log("נמחק פרויקט: " + p.name); if(route() === p.id) go(""); return "ok"; }
      const s = findS(p, str(i.stageId));
      if(i.kind === "stage"){ p.stages = p.stages.filter(x => x !== s); log("נמחק שלב: " + s.title); return "ok"; }
      const t = findT(s, str(i.taskId)); s.tasks = s.tasks.filter(x => x !== t); log("נמחקה משימה: " + t.title); return "ok"; })
  ];
}

let ctl = null;
const MODEL = "claude-opus-5-5";
async function callClaude(body, signal){
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST", signal,
    headers: {
      "content-type": "application/json",
      "x-api-key": cfg().apiKey,
      "anthropic-version": "2026-10-21",
      "anthropic-beta": "server-side-fallback-2026-07-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify(body)
  });
  const j = await r.json().catch(() => ({}));
  if(!r.ok){ const err = new Error(j?.error?.message || ("HTTP " + r.status)); err.status = r.status; throw err; }
  return j;
}

async function send(){
  const box = $("#chat-input");
  const text = box.value.trim();
  if(!text || busy) return;
  if(!cfg().apiKey) return bridgeCopy(text);
  box.value = ""; box.style.height = "auto";
  chat.push({role: "user", content: text, ts: Date.now()});
  busy = true; renderChat();
  const m = $("#msgs");
  const bubble = document.createElement("div"); bubble.className = "msg assistant"; bubble.textContent = "חושב…"; m.append(bubble); scrollMsgs();
  const ops = [];
  const log = s => { ops.push(s); let o = bubble.querySelector(".ops"); if(!o){ o = document.createElement("span"); o.className = "ops"; bubble.append(o); } o.textContent = ops.join(" · "); };
  const now = new Date();
  const system = "אתה העוזר האישי של המשתמש בדף 'מפת הדרך שלי' — דף לניהול פרויקטים, שלבים (נקודות ציון במפת דרך), משימות קצרות וסדר יום. " +
    "המשתמש לומד במכינה ומנהל כמה פרויקטים במקביל. ענה תמיד בעברית, קצר וברור, בגוף שני. " +
    "כשמבקשים שינוי, בצע אותו עם הכלים ואז אמור בשורה-שתיים מה עשית. כשבונים מפת דרך: 4–7 שלבים, וכל שלב מפורק למשימות קצרות וברורות (למשל 'לעשות 5 שיחות ולידציה'), " +
    "ובשדה details כתוב את הפירוט המעשי: השאלות לשאול, הצעדים, או מה נחשב 'בוצע'. אל תמחק בלי בקשה מפורשת. " +
    "סדר העדיפויות הוא סדר הפרויקטים (rank 1 = הכי חשוב). כשמבקשים לתכנן יום, הכנס אירועים עם שעות ריאליות והשאר הפסקות.";
  const context = "היום: " + now.toLocaleDateString("he-IL", {weekday:"long"}) + " " + dkey(now) + ", השעה " + pad(now.getHours()) + ":" + pad(now.getMinutes()) + ". " +
    (route() ? "המשתמש מסתכל כרגע על הפרויקט " + route() + ". " : "") + "המצב הנוכחי של הדף (JSON):\n" + snapshotForClaude();
  const tl = tools(log);
  const apiTools = tl.map(t => ({name: t.name, description: t.description, input_schema: t.inputSchema}));
  const history = chat.slice(-16).map(x => ({role: x.role, content: x.content}));
  while(history.length && history[0].role !== "user") history.shift();
  history[history.length - 1] = {role: "user", content: [{type: "text", text: context}, {type: "text", text: text}]};
  const messages = history;
  ctl = new AbortController();
  let answer = "", note = "";
  try {
    for(let round = 0; round < 8; round++){
      const res = await callClaude({model: MODEL, max_tokens: 16000, system, tools: apiTools, messages, output_config: {effort: "medium"}, fallbacks: "default"}, ctl.signal);
      const texts = (res.content || []).filter(b => b.type === "text").map(b => b.text).join("\n").trim();
      if(texts){ answer = answer ? answer + "\n\n" + texts : texts; bubble.firstChild.nodeValue = answer; scrollMsgs(); }
      if(res.stop_reason === "refusal"){ note = "Claude לא יכול לעזור עם הבקשה הזאת. נסה לנסח אחרת."; break; }
      if(res.stop_reason !== "tool_use") { if(res.stop_reason === "max_tokens") note = "התשובה נקטעה באמצע."; break; }
      messages.push({role: "assistant", content: res.content});
      const results = [];
      for(const b of res.content.filter(b => b.type === "tool_use")){
        const t = tl.find(x => x.name === b.name);
        try {
          const out = t ? t.execute(b.input) : (() => { throw new Error("unknown tool " + b.name); })();
          results.push({type: "tool_result", tool_use_id: b.id, content: typeof out === "string" ? out : JSON.stringify(out)});
        } catch(e){ results.push({type: "tool_result", tool_use_id: b.id, content: String(e.message || e), is_error: true}); }
      }
      messages.push({role: "user", content: results});
    }
    if(!answer && !note) note = ops.length ? "בוצע." : "לא התקבלה תשובה.";
  } catch(e){
    note = e.name === "AbortError" ? "נעצר." :
      e.status === 401 ? "מפתח ה-API לא תקין. בדוק אותו בהגדרות." :
      e.status === 429 ? "יותר מדי בקשות כרגע. נסה שוב בעוד דקה." :
      e.status === 400 && /credit|balance|billing/i.test(e.message) ? "נגמרה היתרה בחשבון ה-API. אפשר להוסיף ב-console.anthropic.com." :
      e instanceof TypeError ? "אין חיבור לאינטרנט, או שהבקשה נחסמה." : "משהו השתבש: " + e.message;
  }
  chat.push({role: "assistant", content: [answer, note].filter(Boolean).join("\n\n"), ops, ts: Date.now()});
  busy = false; ctl = null;
  renderChat(); saveChat();
}

// ---------- bridge: chat through the regular Claude app ----------
function bridgePrompt(request){
  const now = new Date();
  const defs = tools(() => {}).map(t => "- " + t.name + ": " + t.description + " שדות: " + JSON.stringify(t.inputSchema.properties) + (t.inputSchema.required ? " חובה: " + t.inputSchema.required.join(", ") : "")).join("\n");
  return "אתה עוזר לי לנהל את הדף 'מפת הדרך שלי': פרויקטים, שלבים (נקודות ציון), משימות קצרות וסדר יום.\n" +
    "ענה בעברית, קצר. כתוב קודם בשורה-שתיים מה אתה משנה, ואחר כך את השינויים בבלוק קוד אחד שמתחיל ב-```derech ומכיל מערך JSON של פעולות, כל פעולה בצורה {\"op\": שם, ...שדות}.\n" +
    "דוגמה:\n```derech\n[{\"op\":\"add_event\",\"date\":\"2026-11-22\",\"time\":\"10:00\",\"title\":\"שיחות גילוי\",\"projectId\":\"p-ztd\"}]\n```\n" +
    "להפנות לפרויקט, שלב, משימה או אירוע קיימים רק לפי ה-id שלהם מהמצב למטה. לפריט חדש שאתה יוצר באותה תשובה אפשר לתת \"ref\" משלך (למשל \"ref\":\"s1\") ולהשתמש בו אחר כך במקום id. " +
    "כשבונים מפת דרך: 4–7 שלבים, כל שלב עם משימות קצרות וברורות, ובשדה details הפירוט המעשי (שאלות, צעדים). אל תמחק בלי בקשה מפורשת. אם הבקשה לא ברורה, שאל אותי בלי בלוק קוד.\n\n" +
    "הפעולות האפשריות:\n" + defs + "\n\n" +
    "היום: " + now.toLocaleDateString("he-IL", {weekday:"long"}) + " " + dkey(now) + ", השעה " + pad(now.getHours()) + ":" + pad(now.getMinutes()) + ".\n" +
    "המצב הנוכחי (JSON):\n" + snapshotForClaude() + "\n\n" +
    "הבקשה שלי: " + request;
}
async function copyText(s){
  try { await navigator.clipboard.writeText(s); return true; } catch(e){}
  try { const ta = document.createElement("textarea"); ta.value = s; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.append(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); return ok; } catch(e){ return false; }
}
async function bridgeCopy(text){
  const box = $("#chat-input");
  const ok = await copyText(bridgePrompt(text));
  if(!ok){ toast("ההעתקה נכשלה. נסה שוב"); return; }
  box.value = ""; box.style.height = "auto";
  chat.push({role: "user", content: text, ts: Date.now()});
  renderChat(); saveChat();
  $("#bridge").hidden = false; $("#bridge-copied").hidden = false; $("#bridge-paste").value = "";
}
function bridgeApply(){
  const raw = $("#bridge-paste").value;
  const m = raw.match(/```\s*derech\s*([\s\S]*?)```/) || raw.match(/```(?:json)?\s*(\[[\s\S]*?\])\s*```/);
  const explain = raw.replace(/```[\s\S]*?```/g, "").trim();
  if(!m){
    if(!raw.trim()){ toast("הדבק קודם את התשובה של Claude"); return; }
    chat.push({role: "assistant", content: explain || raw.trim(), ops: [], ts: Date.now()});
    $("#bridge-paste").value = ""; $("#bridge").hidden = true;
    renderChat(); saveChat(); toast("אין בתשובה שינויים לביצוע"); return;
  }
  let list;
  try { list = JSON.parse(m[1].trim()); if(!Array.isArray(list)) list = [list]; } catch(e){ toast("לא הצלחתי לקרוא את קוד השינויים. בקש מ-Claude לשלוח אותו שוב"); return; }
  const ops = [], fails = [], refs = {};
  const tl = tools(s => ops.push(s));
  const fix = v => (typeof v === "string" && refs[v]) ? refs[v] : v;
  for(const item of list){
    if(!item || typeof item !== "object") continue;
    const t = tl.find(x => x.name === item.op);
    if(!t){ fails.push("פעולה לא מוכרת: " + item.op); continue; }
    const input = {};
    for(const k of Object.keys(item)) if(k !== "op" && k !== "ref") input[k] = fix(item[k]);
    try {
      const r = t.execute(input);
      if(item.ref && r && typeof r === "object"){ refs[item.ref] = r.id || r.stageId || r.taskId || r.eventId; }
    } catch(e){ fails.push(item.op + ": " + (e.message || e)); }
  }
  chat.push({role: "assistant", content: (explain || "בוצע.") + (fails.length ? "\n\nלא בוצעו: " + fails.join("; ") : ""), ops, ts: Date.now()});
  $("#bridge-paste").value = ""; $("#bridge").hidden = true;
  renderChat(); saveChat();
  toast(ops.length ? "בוצעו " + ops.length + " שינויים" : "לא בוצעו שינויים");
}
$("#bridge-apply").onclick = bridgeApply;
$("#bridge-close").onclick = () => { $("#bridge").hidden = true; };

boot();
})();
</script>
